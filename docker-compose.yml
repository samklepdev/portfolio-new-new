services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    # Values match the DATABASE_URL in .env.example. Override in .env if you
    # already have something on 5432 (POSTGRES_PORT=5433, say) — remember to
    # update DATABASE_URL to match.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portfolio-pgdata:/var/lib/postgresql/data
    # `db:migrate` immediately after `up -d` fails without this — Postgres
    # accepts TCP connections a beat before it is ready to serve queries.
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  portfolio-pgdata:
